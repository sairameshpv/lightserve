# One Loki, logs on its own disk (no object store): enough for short test clusters.
deploymentMode: SingleBinary
loki:
  auth_enabled: false
  commonConfig: {replication_factor: 1}
  storage: {type: filesystem}
  useTestSchema: true            # the chart's built-in schema (fine for a cluster that lives < 1 h)
  limits_config: {retention_period: 24h}
singleBinary:
  replicas: 1
  persistence: {size: 5Gi}
  resources: {requests: {cpu: 50m, memory: 256Mi}, limits: {memory: 768Mi}}
read: {replicas: 0}
write: {replicas: 0}
backend: {replicas: 0}
chunksCache: {enabled: false}
resultsCache: {enabled: false}
gateway: {enabled: false}
lokiCanary: {enabled: false}
test: {enabled: false}
