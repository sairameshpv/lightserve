apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mlflow-data
  namespace: mlops
  annotations:
    helm.sh/resource-policy: keep   # survives a helm uninstall; terraform destroy removes the cluster anyway
spec:
  accessModes: [ReadWriteOnce]
  {{- with .Values.mlflowDisk.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources: {requests: {storage: {{ .Values.mlflowDisk.size }}}}
