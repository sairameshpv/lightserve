global:
  scrape_interval: 5s       # read every target's /metrics this often
  evaluation_interval: 5s   # check alert rules this often

rule_files: [alerts.yml, slo.yml]

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: lightserve
    static_configs:
      - targets: ["host.docker.internal:8001"]
  - job_name: dcgm   # GPU health; "down" on the Mac, where the gpu profile isn't started
    static_configs:
      - targets: ["dcgm-exporter:9400"]
