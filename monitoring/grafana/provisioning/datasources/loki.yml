apiVersion: 1
datasources:
  - name: Loki
    uid: loki
    type: loki
    url: http://loki:3100
    jsonData:
      derivedFields:   # a log line's trace_id becomes a link to that trace in Tempo
        - name: trace_id
          matcherRegex: '"trace_id": "(\w+)"'
          datasourceUid: tempo
          url: "$${__value.raw}"   # $$ = a literal $ in provisioning files
