groups:
  - name: lightserve
    rules:
      - alert: LightserveDown
        expr: up{job="lightserve"} == 0   # Prometheus's own "could I read /metrics?" signal
        for: 30s
        annotations:
          summary: "Prometheus can't reach lightserve's /metrics on {{ $labels.instance }}"
          runbook_url: "https://github.com/sairameshpv/lightserve/blob/main/monitoring/runbooks/lightserve-down.md"

  - name: canary   # training/qlora_financial/canary.py: the same 50 questions every ~5 min
    rules:
      - alert: CanaryAccuracyLow
        # 7m: one bad round holds the gauge ~5 min (no alert), two in a row ~10 min (alert)
        expr: canary_accuracy < canary_expected_accuracy - 0.10
        for: 7m
        labels: {severity: page}
        annotations:
          summary: "Canary accuracy {{ $value | printf \"%.2f\" }} is more than 10 points below normal {{ with query \"canary_expected_accuracy\" }}{{ . | first | value | printf \"%.2f\" }}{{ end }}"
          runbook_url: "https://github.com/sairameshpv/lightserve/blob/main/monitoring/runbooks/canary.md"
      - alert: CanaryStale
        # no complete round (all questions answered) for 15 min (model server failing), or the canary is down
        expr: time() - canary_last_run_timestamp_seconds > 900 or on(job, instance) up{job="canary"} == 0
        for: 2m
        labels: {severity: ticket}
        annotations:
          summary: "No complete canary round for over 15 min, or the canary isn't running"
          runbook_url: "https://github.com/sairameshpv/lightserve/blob/main/monitoring/runbooks/canary.md"
