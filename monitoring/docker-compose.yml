# Prometheus + Grafana for lightserve on the Mac. lightserve itself runs on the host:
#   .venv/bin/python -m server --fake-engine --port 8001
#   cd monitoring && docker compose up -d     (needs GRAFANA_ADMIN_PASSWORD in monitoring/.env)
# Prometheus: http://localhost:9090   Grafana: http://localhost:3000 (user admin)
services:
  prometheus:
    image: prom/prometheus:v3.5.0
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./slo.yml:/etc/prometheus/slo.yml:ro
    ports: ["9090:9090"]
    extra_hosts: ["host.docker.internal:host-gateway"]  # reach lightserve on the host

  alertmanager:   # turns Prometheus alerts into emails
    image: prom/alertmanager:v0.28.1
    command: ["--config.file=/etc/alertmanager/alertmanager.yml"]
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports: ["9093:9093"]

  mailhog:   # local test inbox: http://localhost:8025 (amd64-only image; emulated on Apple Silicon)
    image: mailhog/mailhog:v1.0.1
    platform: linux/amd64
    ports: ["8025:8025"]

  tempo:   # traces; lightserve on the host sends to localhost:4318 (OTEL_EXPORTER_OTLP_ENDPOINT)
    image: grafana/tempo:2.9.0
    command: ["-config.file=/etc/tempo.yml"]
    volumes:
      - ./tempo.yml:/etc/tempo.yml:ro
    ports: ["4318:4318", "3200:3200"]

  loki:   # logs; Loki's own single-process defaults (local filesystem)
    image: grafana/loki:3.5.5
    command: ["-config.file=/etc/loki/local-config.yaml"]
    ports: ["3100:3100"]

  alloy:   # ships monitoring/logs/*.jsonl (lightserve --request-log) to Loki
    image: grafana/alloy:v1.11.0
    command: ["run", "--storage.path=/var/lib/alloy/data", "/etc/alloy/config.alloy"]
    volumes:
      - ./alloy.alloy:/etc/alloy/config.alloy:ro
      - ./logs:/logs:ro

  dcgm-exporter:   # GPU health; GPU node only: docker compose --profile gpu up -d
    image: nvcr.io/nvidia/k8s/dcgm-exporter:4.4.1-4.5.2-ubuntu22.04
    profiles: [gpu]
    command: ["-f", "/etc/dcgm-exporter/lightserve.csv"]
    volumes:
      - ./dcgm-counters.csv:/etc/dcgm-exporter/lightserve.csv:ro
    cap_add: [SYS_ADMIN]   # profiling metrics (DCGM_FI_PROF_*)
    deploy:
      resources:
        reservations:
          devices: [{driver: nvidia, count: all, capabilities: [gpu]}]
    ports: ["9400:9400"]

  grafana:
    image: grafana/grafana:12.1.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in monitoring/.env}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    ports: ["3000:3000"]
