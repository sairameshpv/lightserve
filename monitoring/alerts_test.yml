# Unit tests for alerts.yml, on made-up metrics (no lightserve, canary or cost exporter needed):
#   docker run --rm -v "$PWD/monitoring:/m" -w /m --entrypoint promtool prom/prometheus:v3.5.0 test rules alerts_test.yml
# The canary runs a round every ~5 min and its accuracy holds until the next round, so one bad
# round is ~5 min low; "normal" here is 0.66, so the alarm line is 0.56.
rule_files: [alerts.yml]
evaluation_interval: 1m

tests:
  - name: two bad rounds in a row (10 min at 0.40) fire CanaryAccuracyLow
    interval: 1m
    input_series:
      - series: 'canary_expected_accuracy{job="canary", instance="c:9101"}'
        values: '0.66x30'
      - series: 'canary_accuracy{job="canary", instance="c:9101"}'
        values: '0.66x4 0.40x9 0.66x16'
    alert_rule_test:
      - eval_time: 13m
        alertname: CanaryAccuracyLow
        exp_alerts:
          - exp_labels: {job: canary, instance: "c:9101", severity: page}
            exp_annotations:
              summary: "Canary accuracy 0.40 is more than 10 points below normal 0.66"
              runbook_url: "https://github.com/sairameshpv/lightserve/blob/main/monitoring/runbooks/canary.md"

  - name: one bad round (5 min), a small dip (0.58), or no round yet (NaN) don't fire
    interval: 1m
    input_series:
      - series: 'canary_expected_accuracy{job="canary", instance="c:9101"}'
        values: '0.66x30'
      - series: 'canary_accuracy{job="canary", instance="c:9101"}'
        values: 'NaN NaN NaN NaN NaN 0.40x4 0.66x4 0.58x16'
    alert_rule_test:
      - {eval_time: 9m, alertname: CanaryAccuracyLow, exp_alerts: []}
      - {eval_time: 29m, alertname: CanaryAccuracyLow, exp_alerts: []}

  - name: rounds keep finishing, so not stale
    interval: 1m
    input_series:
      - series: 'up{job="canary", instance="c:9101"}'
        values: '1x40'
      - series: 'canary_last_run_timestamp_seconds{job="canary", instance="c:9101"}'
        values: '0+60x40'   # a fresh timestamp every minute
    alert_rule_test:
      - {eval_time: 40m, alertname: CanaryStale, exp_alerts: []}

  - name: no good round for over 15 min (server not answering) fires CanaryStale
    interval: 1m
    input_series:
      - series: 'up{job="canary", instance="c:9101"}'
        values: '1x40'
      - series: 'canary_last_run_timestamp_seconds{job="canary", instance="c:9101"}'
        values: '300x40'    # last good round at 5 min, then none
    alert_rule_test:
      - {eval_time: 20m, alertname: CanaryStale, exp_alerts: []}   # 15 min ago: not yet
      - eval_time: 25m
        alertname: CanaryStale
        exp_alerts:
          - exp_labels: {job: canary, instance: "c:9101", severity: ticket}
            exp_annotations:
              summary: "No complete canary round for over 15 min, or the canary isn't running"
              runbook_url: "https://github.com/sairameshpv/lightserve/blob/main/monitoring/runbooks/canary.md"

  - name: the canary itself is down fires CanaryStale
    interval: 1m
    input_series:
      - series: 'up{job="canary", instance="c:9101"}'
        values: '0x20'
    alert_rule_test:
      - eval_time: 5m
        alertname: CanaryStale
        exp_alerts:
          - exp_labels: {job: canary, instance: "c:9101", severity: ticket}
            exp_annotations:
              summary: "No complete canary round for over 15 min, or the canary isn't running"
              runbook_url: "https://github.com/sairameshpv/lightserve/blob/main/monitoring/runbooks/canary.md"

  - name: month's GPU cost over budget fires GpuBudgetExceeded; at or under it doesn't
    interval: 1m
    input_series:
      - series: 'gpu_budget_month_dollars{job="cost", instance="c:9102"}'
        values: '100x20'
      - series: 'gpu_cost_month_dollars{job="cost", instance="c:9102"}'
        values: '90x4 100x4 101x12'   # at the budget isn't over it
    alert_rule_test:
      - eval_time: 7m
        alertname: GpuBudgetExceeded
        exp_alerts: []
      - eval_time: 15m
        alertname: GpuBudgetExceeded
        exp_alerts:
          - exp_labels: {job: cost, instance: "c:9102", severity: ticket}
            exp_annotations:
              summary: "GPU cost this month is $101, over the $100 budget"
              runbook_url: "https://github.com/sairameshpv/lightserve/blob/main/monitoring/runbooks/gpu-budget.md"

  - name: lightserve's target gone entirely (Kubernetes, pod killed) fires LightserveDown, as up == 0 does
    interval: 15s
    input_series:
      - series: 'up{job="lightserve", instance="pod-a:8000"}'
        values: '1x4 stale'       # the pod disappears after 1 min: Prometheus marks the series stale, no 0
    alert_rule_test:
      - eval_time: 3m
        alertname: LightserveDown
        exp_alerts:
          - exp_labels: {job: lightserve}
            exp_annotations:
              summary: "Prometheus can't reach lightserve's /metrics: no lightserve target at all (pod gone?)"
              runbook_url: "https://github.com/sairameshpv/lightserve/blob/main/monitoring/runbooks/lightserve-down.md"

  - name: lightserve's target there but unreachable (up == 0) still fires, naming the instance
    interval: 15s
    input_series:
      - series: 'up{job="lightserve", instance="host.docker.internal:8001"}'
        values: '1x4 0x12'
    alert_rule_test:
      - eval_time: 3m
        alertname: LightserveDown
        exp_alerts:
          - exp_labels: {job: lightserve, instance: "host.docker.internal:8001"}
            exp_annotations:
              summary: "Prometheus can't reach lightserve's /metrics on host.docker.internal:8001"
              runbook_url: "https://github.com/sairameshpv/lightserve/blob/main/monitoring/runbooks/lightserve-down.md"
