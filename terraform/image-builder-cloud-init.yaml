#cloud-config
# One-off build script for a CPU-only instance — installs Docker/NVIDIA
# Container Toolkit/Nsight and pre-pulls the vLLM image, WITHOUT launching
# vLLM itself (no GPU present to launch it against). Snapshot the resulting
# disk afterward and point terraform.tfvars' golden_snapshot_id at it — see
# nebius_setup_commands.txt section 11 for the full build/snapshot process.
ssh_authorized_keys:
  - <your-ssh-public-key-here> # e.g. contents of ~/.ssh/id_ed25519.pub
runcmd:
  - apt-get update
  - apt-get install -y ca-certificates curl gnupg

  # Docker
  - install -m 0755 -d /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
  - chmod a+r /etc/apt/keyrings/docker.gpg
  - >
    bash -c 'echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo $VERSION_CODENAME) stable" > /etc/apt/sources.list.d/docker.list'
  - apt-get update
  - apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin

  # NVIDIA Container Toolkit (installs fine without a physical GPU present)
  - curl -fsSL https://nvidia.github.io/libnvidia-container/gpgkey | gpg --dearmor -o /usr/share/keyrings/nvidia-container-toolkit-keyring.gpg
  - >
    bash -c 'curl -s -L https://nvidia.github.io/libnvidia-container/stable/deb/nvidia-container-toolkit.list |
    sed "s#deb https://#deb [signed-by=/usr/share/keyrings/nvidia-container-toolkit-keyring.gpg] https://#g" >
    /etc/apt/sources.list.d/nvidia-container-toolkit.list'
  - apt-get update
  - apt-get install -y nvidia-container-toolkit
  - nvidia-ctk runtime configure --runtime=docker

  # Nsight Systems/Compute
  - wget -q https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64/cuda-keyring_1.1-1_all.deb -O /tmp/cuda-keyring.deb
  - dpkg -i /tmp/cuda-keyring.deb
  - apt-get update
  - apt-get install -y cuda-nsight-systems cuda-nsight-compute

  # Pre-pull the vLLM image so it's baked into the disk too (saves the largest
  # download at GPU-instance boot time; only the model weights remain to fetch)
  - docker pull vllm/vllm-openai:latest

  - apt-get clean
  - cloud-init clean --logs --seed
  - touch /tmp/golden-image-ready
