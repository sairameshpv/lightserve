name: image

# Builds the cluster's own images and pushes them to GitHub's container registry: lightserve
# (infra/docker/lightserve.Dockerfile, fake and gpu targets) and Airflow with the pipeline's
# packages (infra/docker/airflow.Dockerfile). The cluster (infra/terraform) pulls them from there:
# ghcr.io rather than a Nebius registry, which would live only as long as a cluster session.
# Pull requests build without pushing.
on:
  push:
    branches: [main]
    paths: ["server/**", "engine/**", "model/**", "kernels/**", "mlops/requirements.txt", "infra/docker/**", ".dockerignore", ".github/workflows/image.yml"]
  pull_request:
    paths: ["server/**", "engine/**", "model/**", "kernels/**", "mlops/requirements.txt", "infra/docker/**", ".dockerignore", ".github/workflows/image.yml"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write   # push to ghcr.io with the run's own token: no stored secret
    strategy:
      matrix:
        include:
          - {image: lightserve, file: infra/docker/lightserve.Dockerfile, target: fake, tag: fake-}
          - {image: lightserve, file: infra/docker/lightserve.Dockerfile, target: gpu, tag: gpu-}
          - {image: airflow-mlops, file: infra/docker/airflow.Dockerfile, target: "", tag: ""}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Free disk space for the CUDA torch layer (~6 GB) and Airflow (~4 GB)
        if: matrix.target != 'fake'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc && df -h / | tail -1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ matrix.tag }}${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ matrix.tag }}latest
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
