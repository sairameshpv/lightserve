name: kernels

on:
  push:
    branches: [main]
    paths:
      - "kernels/**"
      - ".github/workflows/kernels-ci.yml"
  pull_request:
    paths:
      - "kernels/**"
      - ".github/workflows/kernels-ci.yml"

jobs:
  test:
    # GitHub-hosted runners have no GPU, so the CUDA-only cases in
    # kernels/tests are skipped here (see requires_cuda in that file) --
    # this job still catches import errors, shape-validation regressions,
    # and anything else that doesn't need a real device. Full correctness
    # (allclose vs the PyTorch reference) is verified on a real L40S; see
    # kernels/README.md.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install triton pytest

      - name: Run kernel tests
        run: pytest kernels/tests/ -v
