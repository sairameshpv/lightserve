name: kernels

on:
  push:
    branches: [main]
    paths:
      - "kernels/**"
      - "model/**"
      - "server/**"
      - "engine/**"
      - "benchmarks/**"
      - "training/**"
      - ".github/workflows/kernels-ci.yml"
  pull_request:
    paths:
      - "kernels/**"
      - "model/**"
      - "server/**"
      - "engine/**"
      - "benchmarks/**"
      - "training/**"
      - ".github/workflows/kernels-ci.yml"

# The run's GitHub token can only read the repo; a job that needs more asks for it.
permissions:
  contents: read

jobs:
  test:
    # GitHub-hosted runners have no GPU, so the CUDA-only cases in
    # kernels/tests and model/tests are skipped here (see requires_cuda in
    # those files) -- this job still catches import errors, shape-
    # validation regressions, and anything else that doesn't need a real
    # device. model/minimal_llama.py imports straight from kernels/, so it
    # exercises the same CPU-only-triton-import path kernels/tests already
    # relies on. Full correctness (allclose vs the PyTorch reference) is
    # verified on a real L40S; see kernels/README.md.
    #
    # server/tests/ needs none of that -- it runs against FakeEngine (see
    # server/tests/fake_engine.py), never importing model/ or kernels/ at
    # all, so it's real, full-coverage CI, not skip-gated -- see
    # server/README.md.
    #
    # engine/tests/ is torch-free (see engine/request.py's module
    # docstring), so it's real, full-coverage CI too -- no skip gating.
    #
    # benchmarks/tests/ only imports its own torch-free helpers at module
    # level (e.g. measure_ttft.py's build_workload/summarize_results) --
    # the actual LLMEngine/torch imports it exercises are local to main(),
    # so this too collects and runs cleanly with no GPU and no skip gating.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.11"
          cache: pip  # the repo has no lockfile; any file works as the cache key
          cache-dependency-path: training/qlora_financial/requirements.txt

      - name: Install dependencies
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install triton pytest fastapi uvicorn httpx prometheus_client opentelemetry-sdk safetensors numpy

      - name: Lint (ruff, real-mistake checks only)
        # F = pyflakes (unused/undefined names, broken imports), E9 = syntax
        # errors. Style rules stay off so old code isn't churned.
        run: |
          pip install ruff==0.14.0
          ruff check kernels model server engine benchmarks --select F,E9

      - name: Run kernel, model, server, engine, and benchmarks tests
        # `python -m pytest`, not the bare `pytest` console script: this repo
        # has no pyproject.toml/setup.py and no conftest.py, so nothing
        # else puts the repo root on sys.path for `from kernels/model/engine
        # import ...` to resolve -- `-m` does that by inserting CWD, `pytest`
        # alone doesn't (see git history for the ModuleNotFoundError this
        # was hit by).
        run: python -m pytest kernels/tests/ model/tests/ server/tests/ engine/tests/ benchmarks/tests/ -v

  training:
    # training/ tests are CPU-only: they cover data prep, scoring, the
    # calculator, RL pairs, model registry and promotion gate, plus tiny CPU
    # checks of the training helpers.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.11"
          cache: pip  # the repo has no lockfile; any file works as the cache key
          cache-dependency-path: training/qlora_financial/requirements.txt
      - name: Install dependencies
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install pytest numpy transformers huggingface_hub peft ruff==0.14.0 mlflow==3.16.1 evidently==0.7.23 pandas==2.3.3  # as mlops/requirements.txt
      - name: Lint (ruff, real-mistake checks only)
        run: ruff check training --select F,E9
      - name: Run training tests
        run: python -m pytest training -v

  smoke:
    # The real server as a running program (fake engine, no torch): health,
    # one completion, and /metrics counting it.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.11"
          # no pip cache here: the jobs share one cache slot, and this job finishing
          # first would fill it with 4 small libraries instead of torch
      - run: pip install fastapi uvicorn prometheus_client opentelemetry-sdk
      - name: Serve, request, check /metrics
        shell: bash
        run: |
          python -m server --fake-engine --port 8001 > server.log 2>&1 &
          for i in $(seq 30); do curl -sf --max-time 5 localhost:8001/health && break; sleep 1; done
          curl -sf --max-time 5 localhost:8001/v1/completions -H 'Content-Type: application/json' \
            -d '{"prompt":[1,2,3],"max_tokens":4}' | grep -F '"finish_reason":"length"'
          curl -sf --max-time 5 localhost:8001/metrics | grep -F 'lightserve_requests_total{status="FINISHED_LENGTH_CAPPED"} 1.0'
      - if: failure()
        run: cat server.log

  security:
    # Known-vulnerability scan of every Python library CI and training install,
    # at the versions pip picks today (the training list sets only minimums).
    # Not covered: what's actually installed on the GPU node or in the
    # vLLM/OpenRLHF containers. Trivy runs from its image pinned by
    # digest, not trivy-action (its tags were hijacked in March 2026); 0.67.2
    # predates that.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.11"
          cache: pip  # the repo has no lockfile; any file works as the cache key
          cache-dependency-path: training/qlora_financial/requirements.txt
      - name: Install everything, then list exact versions
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r training/qlora_financial/requirements.txt triton pytest fastapi uvicorn httpx \
            prometheus_client opentelemetry-sdk safetensors numpy huggingface_hub
          mkdir scan && pip freeze > scan/requirements.txt
          echo "scanning $(wc -l < scan/requirements.txt) packages"
      - name: Trivy (report HIGH + CRITICAL, fail on CRITICAL)
        run: |
          T="docker run --rm -v $PWD/scan:/scan:ro -v trivy-cache:/root/.cache aquasec/trivy@sha256:e2b22eac59c02003d8749f5b8d9bd073b62e30fefaef5b7c8371204e0a4b0c08"
          $T fs --scanners vuln --severity HIGH,CRITICAL /scan
          $T fs --scanners vuln --severity CRITICAL --exit-code 1 --quiet /scan
