name: kernels

on:
  push:
    branches: [main]
    paths:
      - "kernels/**"
      - "model/**"
      - "server/**"
      - "engine/**"
      - "benchmarks/**"
      - "training/**"
      - ".github/workflows/kernels-ci.yml"
  pull_request:
    paths:
      - "kernels/**"
      - "model/**"
      - "server/**"
      - "engine/**"
      - "benchmarks/**"
      - "training/**"
      - ".github/workflows/kernels-ci.yml"

jobs:
  test:
    # GitHub-hosted runners have no GPU, so the CUDA-only cases in
    # kernels/tests and model/tests are skipped here (see requires_cuda in
    # those files) -- this job still catches import errors, shape-
    # validation regressions, and anything else that doesn't need a real
    # device. model/minimal_llama.py imports straight from kernels/, so it
    # exercises the same CPU-only-triton-import path kernels/tests already
    # relies on. Full correctness (allclose vs the PyTorch reference) is
    # verified on a real L40S; see kernels/README.md.
    #
    # server/tests/ needs none of that -- it runs against FakeEngine (see
    # server/tests/fake_engine.py), never importing model/ or kernels/ at
    # all, so it's real, full-coverage CI, not skip-gated -- see
    # server/README.md.
    #
    # engine/tests/ is torch-free (see engine/request.py's module
    # docstring), so it's real, full-coverage CI too -- no skip gating.
    #
    # benchmarks/tests/ only imports its own torch-free helpers at module
    # level (e.g. measure_ttft.py's build_workload/summarize_results) --
    # the actual LLMEngine/torch imports it exercises are local to main(),
    # so this too collects and runs cleanly with no GPU and no skip gating.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install triton pytest fastapi uvicorn httpx prometheus_client opentelemetry-sdk safetensors numpy

      - name: Lint (ruff, real-mistake checks only)
        # F = pyflakes (unused/undefined names, broken imports), E9 = syntax
        # errors. Style rules stay off so old code isn't churned.
        run: |
          pip install ruff==0.14.0
          ruff check kernels model server engine benchmarks --select F,E9

      - name: Run kernel, model, server, engine, and benchmarks tests
        # `python -m pytest`, not the bare `pytest` console script: this repo
        # has no pyproject.toml/setup.py and no conftest.py, so nothing
        # else puts the repo root on sys.path for `from kernels/model/engine
        # import ...` to resolve -- `-m` does that by inserting CWD, `pytest`
        # alone doesn't (see git history for the ModuleNotFoundError this
        # was hit by).
        run: python -m pytest kernels/tests/ model/tests/ server/tests/ engine/tests/ benchmarks/tests/ -v

  training:
    # training/ tests are CPU-only: they cover data prep, scoring, the
    # calculator and RL pairs, plus tiny CPU checks of the training helpers.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install pytest numpy transformers huggingface_hub peft ruff==0.14.0
      - name: Lint (ruff, real-mistake checks only)
        run: ruff check training --select F,E9
      - name: Run training tests
        run: python -m pytest training -v

  smoke:
    # The real server as a running program (fake engine, no torch): health,
    # one completion, and /metrics counting it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install fastapi uvicorn prometheus_client opentelemetry-sdk
      - name: Serve, request, check /metrics
        shell: bash
        run: |
          python -m server --fake-engine --port 8001 > server.log 2>&1 &
          for i in $(seq 30); do curl -sf localhost:8001/health && break; sleep 1; done
          curl -sf localhost:8001/v1/completions -H 'Content-Type: application/json' \
            -d '{"prompt":[1,2,3],"max_tokens":4}' | grep -F '"finish_reason":"length"'
          curl -sf localhost:8001/metrics | grep -F 'lightserve_requests_total{status="FINISHED_LENGTH_CAPPED"} 1.0'
      - if: failure()
        run: cat server.log
